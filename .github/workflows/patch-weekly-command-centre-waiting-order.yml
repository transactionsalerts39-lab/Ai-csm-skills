name: Patch weekly command centre waiting order

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch-weekly-command-centre-waiting-order.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Move Customers Waiting on You near top of output
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('skills/weekly-command-centre.md')
          text = p.read_text()
          original = text

          old_block = '''
Stale / Risk Accounts to Watch
| Account | Status | Signal | Suggested move |
|---|---|---|---|
| [Account] | [Engagement Status / Outreach Step] | [stale/risk signal] | [action] |

Customers Waiting on You
| Account | Status | Waiting for | Timing |
|---|---|---|---|
| [Account] | [Engagement Status / Outreach Step] | [item owed] | [today/this week/late this week] |
'''
          new_block = '''
Stale / Risk Accounts to Watch
| Account | Status | Signal | Suggested move |
|---|---|---|---|
| [Account] | [Engagement Status / Outreach Step] | [stale/risk signal] | [action] |
'''
          text = text.replace(old_block, new_block)

          anchor = '''Interesting Observations
- [Only include 1–3 short observations if useful. Omit if not useful.]

'''
          insert = '''Interesting Observations
- [Only include 1–3 short observations if useful. Omit if not useful.]

Customers Waiting on You
| Account | Status | Waiting for | Timing |
|---|---|---|---|
| [Account] | [Engagement Status / Outreach Step] | [item owed] | [today/this week/late this week] |

'''
          if anchor in text:
              text = text.replace(anchor, insert, 1)
          else:
              raise SystemExit('Could not find Interesting Observations anchor')

          text = text.replace(
              '- Start with **Cadence Hygiene** after status-hygiene notes when cadence issues exist.\n- Then show **Renewal Focus Window**.\n- Then show **Do First This Week**.',
              '- Start with **Interesting Observations** when useful.\n- Then show **Customers Waiting on You** as the first action-oriented section when any items exist. This section should appear near the top, not at the end, because these are owed follow-ups Ranjodh should not miss.\n- Then show status hygiene and **Cadence Hygiene** when those sections exist.\n- Then show **Renewal Focus Window**.\n- Then show **Do First This Week**.'
          )

          text = text.replace(
              '- Use tables for Status Updates Applied, Status Updates to Review, Cadence Hygiene, Renewal Focus Window, Do First This Week, Priority 2, Priority 3, Stale / Risk Accounts, and Customers Waiting on You.',
              '- Use tables for Customers Waiting on You, Status Updates Applied, Status Updates to Review, Cadence Hygiene, Renewal Focus Window, Do First This Week, Priority 2, Priority 3, and Stale / Risk Accounts.'
          )

          if text == original:
              raise SystemExit('No changes made; patch anchors may have changed.')

          p.write_text(text)
          print('Patched weekly-command-centre.md output order')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/weekly-command-centre.md
          if git diff --cached --quiet; then
            echo "No skill changes to commit."
            exit 0
          fi
          git commit -m "Move customers waiting section near top"
          git push
