name: Patch weekly command centre past renewals

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch-weekly-command-centre-past-renewals.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Patch weekly command centre renewal window logic
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('skills/weekly-command-centre.md')
          text = p.read_text()
          original = text

          text = text.replace(
              'focus window covering the current quarter, next quarter, and first half of the following\n  quarter, and surfaces cadence hygiene issues where a cadence is active but Cadence Frequency\n  is missing or inconsistent.',
              'focus window covering today through the current quarter, next quarter, and first half of the following\n  quarter, and excludes past renewal dates by default. It also surfaces cadence hygiene issues where\n  a cadence is active but Cadence Frequency is missing or inconsistent.'
          )

          text = text.replace(
              '- Which renewals fall inside the focus window: current quarter, next quarter, and first half of the following quarter',
              '- Which future renewals fall inside the focus window: today through the current quarter, next quarter, and first half of the following quarter'
          )

          text = text.replace(
              'Unless the user specifies otherwise, include renewing accounts from:\n\n1. The current fiscal quarter\n2. The next fiscal quarter\n3. The first half of the following fiscal quarter\n\nUse the current date in Asia/Kolkata to determine the current quarter.',
              'Unless the user specifies otherwise, include renewing accounts from:\n\n1. Today through the end of the current fiscal quarter\n2. The next fiscal quarter\n3. The first half of the following fiscal quarter\n\nUse the current date in Asia/Kolkata to determine the current quarter and the forward-looking start date.\n\nPast renewal dates are excluded by default. If Renewal Date is earlier than today in Asia/Kolkata, do not include the account in the Renewal Focus Window, even if the date is inside the current fiscal quarter.'
          )

          text = text.replace(
              '- Renewal Date is within the renewal focus window\n- Account has not already renewed, churned, or been fully offboarded unless action is still required',
              '- Renewal Date is within the renewal focus window\n- Renewal Date is today or in the future; exclude Renewal Date earlier than today\n- Account has not already renewed, churned, or been fully offboarded unless the user explicitly asks to include past/closed renewals'
          )

          text = text.replace(
              'Sort by Renewal Date ascending.\nDo not use top 10 for the full year by default. The renewal section should be based on the rolling quarter window.',
              'Sort by Renewal Date ascending.\nDo not use top 10 for the full year by default. The renewal section should be based on the forward-looking rolling quarter window.\n\nExample: if today is July 9, 2026, a Renewal Date of July 8, 2026 is excluded by default, even though July 8 is inside fiscal Q2. A Renewal Date of July 9, 2026 or later can be included if it otherwise matches the focus window and assignment filters.'
          )

          text = text.replace(
              'Renewal proximity should boost priority when there is an open task, weak engagement, risk, or no clear next step.',
              'Renewal proximity should boost priority only for future or same-day renewals. Past renewal dates must not create renewal priority by default, even if they are inside the current fiscal quarter. Renewal proximity should boost priority when there is an open task, weak engagement, risk, or no clear next step.'
          )

          text = text.replace(
              '- Renewal is upcoming or within 120 days and engagement is weak, blocked, or stale',
              '- Renewal is upcoming from today forward or within the next 120 days and engagement is weak, blocked, or stale'
          )

          text = text.replace(
              '- Renewal is inside the current fiscal quarter and any task is open.\n- Renewal is within 60 days and any task is open.\n- Renewal is within 120 days and Churn Risk is `Yellow` or `Confirmed churn`.\n- Renewal is within 120 days and Engagement Status is `Support / blocker active`, `Customer replied - scheduling`, `No response - follow-up needed`, `Multithread required`, or `Connected - no cadence`.\n- Renewal is within 120 days and no clear next step is captured.\n- Renewal is inside the current or next fiscal quarter and there is no meaningful recent activity.',
              '- Renewal is today or later in the current fiscal quarter and any task is open.\n- Renewal is today or later and within 60 days, and any task is open.\n- Renewal is today or later and within 120 days, and Churn Risk is `Yellow` or `Confirmed churn`.\n- Renewal is today or later and within 120 days, and Engagement Status is `Support / blocker active`, `Customer replied - scheduling`, `No response - follow-up needed`, `Multithread required`, or `Connected - no cadence`.\n- Renewal is today or later and within 120 days, and no clear next step is captured.\n- Renewal is today or later inside the current or next fiscal quarter and there is no meaningful recent activity.'
          )

          text = text.replace(
              'Use this logic:\n- If renewal is within 120 days and there is no recent meaningful activity → urgent.',
              'Use this logic:\n- If renewal is today or later and within 120 days, and there is no recent meaningful activity → urgent.\n- If Renewal Date is earlier than today, do not treat it as a stale-renewal urgency driver by default.'
          )

          text = text.replace(
              'Unless the user specifies otherwise, include accounts where:\n- Assigned / Current Active CSM = `Ranjodh`\n- Renewal Date falls inside current fiscal quarter, next fiscal quarter, and first half of the following fiscal quarter',
              'Unless the user specifies otherwise, include accounts where:\n- Assigned / Current Active CSM = `Ranjodh`\n- Renewal Date is today or in the future\n- Renewal Date falls between today and the end of the current fiscal quarter, inside the next fiscal quarter, or inside the first half of the following fiscal quarter\n\nDo not include accounts with Renewal Date earlier than today in the Renewal Focus Window. A past renewal date from earlier in the current fiscal quarter should be excluded by default.'
          )

          text = text.replace(
              'Group or label each account by `Current Quarter`, `Next Quarter`, or `First Half Following Quarter`.',
              'Group or label each account by `Current Quarter`, `Next Quarter`, or `First Half Following Quarter`. For current-quarter accounts, include only dates from today through quarter-end.'
          )

          text = text.replace(
              '- `Immediate` = renewal within 30 days',
              '- `Immediate` = renewal today through the next 30 days'
          )

          if text == original:
              raise SystemExit('No changes made; patch anchors may have changed.')

          p.write_text(text)
          print('Patched weekly-command-centre.md with past renewal exclusion logic')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/weekly-command-centre.md
          if git diff --cached --quiet; then
            echo "No skill changes to commit."
            exit 0
          fi
          git commit -m "Exclude past renewal dates from weekly command centre"
          git push
